line-length = 100
target-version = "py313"

[lint]
select = ["ALL"]
ignore = [
    "D1",      # docstrings where they add something
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "COM812",  # handled by the formatter
    "CPY",     # no per-file copyright headers
    "T201",    # build.py reports what it built
]
